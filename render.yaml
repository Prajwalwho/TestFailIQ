services:
  - type: web
    name: testfailiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2'); import sys; sys.path.insert(0, '.'); from storage.knowledge_base import KnowledgeBase; kb = KnowledgeBase(); kb.load()"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: GROQ_API_KEY
        sync: false
