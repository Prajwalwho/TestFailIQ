services:
  - type: web
    name: testfailiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
